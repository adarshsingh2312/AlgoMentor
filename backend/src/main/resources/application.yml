spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: algomentor-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:algomentor}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/auth/callback}
  codeforces:
    base-url: https://codeforces.com/api
    timeout-seconds: 10
    min-interval-ms: 2000
    max-attempts: 3
    initial-backoff-ms: 1000
  sync:
    enabled: true
    problemset-cron: "0 0 3 * * *"   # daily 03:00
    submissions-cron: "0 0 */6 * * *" # every 6 hours
  timezone: "Asia/Kolkata"
  analytics:
    min-attempts: 5
  recommender:
    daily-count: 3
  mail:
    enabled: true
    from: digest@algomentor.local
    digest-cron: "0 0 7 * * *"
    base-url: ${APP_BASE_URL:http://localhost:5173}
  dsa:
    seed-enabled: true
  notes:
    max-documents: 50
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    service-key: ${AI_SERVICE_KEY}
    ingest-timeout-seconds: 30
    ask-timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
