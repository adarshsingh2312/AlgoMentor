spring:
  application:
    name: algomentor-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:algomentor}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/auth/callback}
  codeforces:
    base-url: https://codeforces.com/api
    timeout-seconds: 10
    min-interval-ms: 2000
    max-attempts: 3
    initial-backoff-ms: 1000
  sync:
    enabled: true
    problemset-cron: "0 0 3 * * *"   # daily 03:00
    submissions-cron: "0 0 */6 * * *" # every 6 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info
